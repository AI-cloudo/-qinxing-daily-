name: 每日禽类行情云端更新

on:
  schedule:
    # GitHub 用世界标准时(UTC)：北京时间 = UTC + 8
    # 23:30 UTC = 北京 07:30 —— 首跑，8 点前页面已是最新一次抓取结果
    # 01:30 UTC = 北京 09:30 —— 补跑，行情站多在 8-9 点才发当日文章，此时才抓得到当天真实数据
    - cron: '30 23 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write   # 自动提交 data.json 回仓库
  pages: write       # 发布页面
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取行情与新闻，并把当日数据烘进页面快照
        run: |
          python scrape.py
          python build.py

      - name: 把最新数据与页面提交回仓库（作为明天的环比基准）
        run: |
          git config user.name "auto-report-bot"
          git config user.email "actions@github.com"
          git add data.json state.json index.html
          git diff --cached --quiet || git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传页面（index.html 为工作台，实时数据由页面从 data.json 拉取）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
