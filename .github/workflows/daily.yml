name: 每日禽类行情云端更新

on:
  schedule:
    # GitHub 用世界标准时(UTC)：北京时间 = UTC + 8
    # 23:00 UTC = 北京 07:00 —— 首跑（2026-10-21 由 08:00 提前）。此轮多数源站当天文章
    #   尚未发布，作用是"把昨天已发布的内容全部落库"，保证早上打开就是最近一期而非空档。
    # 00:00 UTC = 北京 08:00 —— 二跑，抓当天陆续发布的早班稿
    # 01:00 UTC = 北京 09:00 —— 三跑，行情站多在 8-9 点才发当日文章，此时才抓得到当天真实数据
    # 02:00 UTC = 北京 10:00 —— 保底跑，周末/节假日源发文更慢，做最后一次兜底
    # ⚠ GitHub 的 schedule 是"尽力而为"：排队延迟常见 5-60 分钟，偶发整轮不触发
    #   （2026-10-21 的 08:00、09:00 两轮均未触发，靠手动 dispatch 才补上）。
    #   所以"到点没更新"先查 Actions 运行记录，别怀疑抓取。
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write   # 自动提交 data.json 回仓库
  pages: write       # 发布页面
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取行情与新闻（数据滞后时自动等待重抓）
        # scrape.py 在 REQUIRE_FRESH=1 下，若抓到的最新板块日期比今天早 >=2 天，
        # 说明新一期没抓到（源站漏抓/解析失败），以退出码 3 告知这里等待后重跑。
        # 滞后 1 天属正常（凌晨或周末源尚未发文），不会触发重抓，免得空等。
        run: |
          set +e
          for i in 1 2 3; do
            echo "===== 第 $i 轮抓取 · 北京时间 $(TZ=Asia/Shanghai date +'%H:%M') ====="
            REQUIRE_FRESH=1 python scrape.py
            code=$?
            if [ $code -eq 0 ]; then
              echo ">>> 已是源站最新一期，停止重试"
              break
            fi
            echo ">>> 退出码 $code（3 = 数据明显滞后，其他 = 脚本异常）"
            if [ $i -lt 3 ]; then
              echo ">>> 等待 6 分钟后重抓"
              sleep 360
            fi
          done
          set -e
          echo ">>> 抓取流程结束，开始构建页面"

      - name: 把当日数据烘进页面快照
        run: python build.py

      - name: 输出各板块数据日期（便于排查滞后来源）
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data.json', encoding='utf-8'))
          m = d.get('meta', {})
          print('更新时间 :', m.get('update_time'))
          print('日期跨度 :', m.get('data_span') or '各板块同日')
          for s in d.get('sections', []):
              print('  - %-8s %s' % (s.get('title', '')[:8], s.get('tag', '')))
          PY

      # ===== 防静默：本轮没写出数据 / 体检不过，就让整个 run 变红 =====
      # 背景（2026-10-21）：上面抓取步骤用了 set +e，脚本即使 exit 1 也会继续 build + commit，
      # 结论照样显示 success。10/20 就是 817 变量未初始化导致整轮报废，但没人发现。
      # 这里做两道硬判定：
      #   ① data.json 的 update_time 必须属于今天 —— 否则说明本轮脚本根本没跑成功；
      #   ② meta.health.level 不能是 fail —— 关键表行数异常/速览卡错位属于真故障。
      # warn（某源滞后一天）不判失败，那是源站节奏。
      - name: 数据完整性硬校验（失败则本轮标红）
        run: |
          python - <<'PY'
          import json, datetime, sys
          d = json.load(open('data.json', encoding='utf-8'))
          m = d.get('meta') or {}
          bj = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          today = bj.strftime('%m-%d')
          ut = str(m.get('update_time') or '')
          h = m.get('health') or {}
          print('本轮更新时间:', ut, '| 期望日期:', today)
          print('体检:', h.get('level'), '|', h.get('summary'))
          for it in (h.get('items') or []):
              if it.get('level') != 'ok':
                  print('  ! %s %s %s %s' % (it.get('sec'), it.get('what'),
                                              it.get('date'), it.get('msg')))
          bad = []
          if not ut.startswith(today):
              bad.append('data.json 不是本轮产物（update_time=%s）→ 抓取脚本很可能异常退出' % ut)
          if h.get('level') == 'fail':
              bad.append('数据体检未通过：%s' % h.get('summary'))
          if bad:
              for b in bad:
                  print('::error::' + b)
              sys.exit(1)
          print('>>> 硬校验通过')
          PY

      - name: 把最新数据与页面提交回仓库（作为明天的环比基准）
        run: |
          git config user.name "auto-report-bot"
          git config user.email "actions@github.com"
          git add data.json state.json index.html
          git diff --cached --quiet || git commit -m "自动更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          # push 前先拉平远端：周一早 AI 精修自动化会推 scrape.py/build.py/src_policy.json，
          # 与定时抓取同时段提交会撞车（2026-10-26 两次 push rejected (fetch first)）。
          # 精修不动 data.json，rebase 无冲突；--autostash 兜住未暂存改动。
          git pull --rebase --autostash origin main
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传页面（index.html 为工作台，实时数据由页面从 data.json 拉取）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
