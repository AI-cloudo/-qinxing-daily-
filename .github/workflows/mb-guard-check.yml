name: mb guard check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 测试写标记权限
        working-directory: morning-brief-src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_BY: cloud-test
        run: |
          python3 dingtalk.py --status
          python3 -c "import dingtalk; print('写入结果:', dingtalk.mark_pushed('cloud-test'))"
          git pull --rebase -q || true
          cat pushed.json
